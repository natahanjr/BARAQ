# nginx reverse-proxy for BARAQ
# Place in /etc/nginx/conf.d/ (Linux) or C:\nginx\conf\nginx.conf (Windows).
# The SOC stays bound to 127.0.0.1:8001; nginx terminates TLS and proxies.

server {
    listen 443 ssl http2;
    server_name soc.example.com;

    # Let's Encrypt (or your CA) certificate paths:
    ssl_certificate     /etc/letsencrypt/live/soc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soc.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Large agent ingest batches are expected; 50MB cap.
    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        # Needed for the realtime websocket channel (/api/realtime/ws):
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# Optional: plain-HTTP listener that only redirects to HTTPS.
server {
    listen 80;
    server_name soc.example.com;
    return 301 https://$host$request_uri;
}
