# BARAQ SOC Platform - Full Stack
#
# Start (development):
#   docker compose up -d
#   open http://localhost:8001
#
# Start (production):
#   docker compose --profile production up -d
#   open http://localhost:8001
#
# Stop:
#   docker compose down
#
# Reset (wipe data):
#   docker compose down -v

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: baraq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baraq}
      POSTGRES_USER: ${POSTGRES_USER:-baraq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baraq_secret_2026}
    volumes:
      - baraq-pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baraq} -d ${POSTGRES_DB:-baraq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - baraq-net

  # ── Redis 7 (caching, rate limiting, sessions) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: baraq-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - baraq-redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baraq-net

  # ── BARAQ Backend (API + Scheduler) ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: baraq/soc:latest
    container_name: baraq-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BARAQ_ROLE: api
      BARAQ_AUTH_ENABLED: "1"
      BARAQ_API_KEYS: ${BARAQ_API_KEYS:-{"baraq-dev-admin":"admin"}}
      BARAQ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-baraq}:${POSTGRES_PASSWORD:-baraq_secret_2026}@db:5432/${POSTGRES_DB:-baraq}
      BARAQ_REDIS_URL: redis://redis:6379/0
      BARAQ_INTERVAL: "15"
      BARAQ_TLS: "0"
      BARAQ_SCHEDULER_ENABLED: "1"
      BARAQ_TELEMETRY_V2: "1"
      BARAQ_ALERTS_V2: "1"
      BARAQ_CORRELATION: "1"
      BARAQ_RISK: "1"
      BARAQ_BEHAVIOR_GROUPS: "1"
      BARAQ_V2_ENGINES_ALLOW_PROD: "1"
      BARAQ_SKIP_SECRET_GEN: "1"
      BARAQ_ALLOW_PLAINTEXT_PROD: "1"
    ports:
      - "${BARAQ_PORT:-8001}:8001"
    volumes:
      - baraq-logs:/app/logs
      - baraq-reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - baraq-net

  # ── Prometheus (monitoring) ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: baraq-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - baraq-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - baraq-net

  # ── Grafana (dashboards) ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.1
    container_name: baraq-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - baraq-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - baraq-net

volumes:
  baraq-pg-data:
  baraq-redis-data:
  baraq-logs:
  baraq-reports:
  baraq-prometheus-data:
  baraq-grafana-data:

networks:
  baraq-net:
    driver: bridge
