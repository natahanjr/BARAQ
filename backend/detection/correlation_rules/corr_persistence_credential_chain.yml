name: persistence_credential_chain
description: A persistence mechanism established on the same host that then touches credential material - a stealthy foothold maintained for credential theft.
enabled: true
severity: critical
confidence: 0.9
mitre_id: T1003
recommendation: Assume credentials are compromised. Disable the persistence mechanism, force credential rotation and hunt for reuse of the stolen material.
window_minutes: 90
group_by: host
match: all
stages:
  - label: Persistence
    rules: [persistence, shortcut_persistence, service_image_path_persistence, wmi_subscription, startup_folder, scheduled_task_created]
    tactics: [Persistence]
  - label: Credential Access
    rules: [lsass_dump, credential_store_theft, kerberoast, asrep_roast, cached_credentials, keylogging]
    tactics: [Credential Access]