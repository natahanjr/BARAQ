name: brute_force_admin_escalation
description: Failed logons followed by a privileged group membership change on the same host indicate a brute-force campaign that succeeded.
enabled: true
severity: critical
confidence: 0.9
mitre_id: T1078
recommendation: Assume the targeted account is compromised. Force a password reset, review privileged group changes and audit logon activity for the host.
window_minutes: 60
group_by: host
match: all
stages:
  - label: Credential Access
    rules: [brute_force]
    tactics: [Credential Access]
  - label: Privilege Escalation
    rules: [privilege_escalation, account_tampering]
    tactics: [Privilege Escalation]