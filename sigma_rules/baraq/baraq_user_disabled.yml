# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - User Account Disabled"
id: baraq-4725-user-disabled
status: experimental
level: low
description: A user account was disabled. Confirm it was intentional.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        TargetUserName:endswith: "@"
    selection_filter:
        TargetUserName:endswith: $
    condition: selection_sel and not selection_filter
fields:
    - TargetUserName
    - SubjectUserName
    - TargetSid
falsepositives:
    - Offboarding procedures
tags:
    - attack.persistence
    - attack.t1098
