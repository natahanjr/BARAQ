# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - Password Spray Across Accounts"
id: baraq-4625-spray
status: experimental
level: high
description: "More than 5 failed logons from one source address, indicating a password-spray attempt."
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        LogonType: [2, 3]
        FailureReason:endswith: bad password
    condition: selection_sel | count() by IpAddress > 5
fields:
    - IpAddress
    - AccountName
    - WorkstationName
falsepositives:
    - "Automated health-check scripts"
tags:
    - attack.credential_access
    - attack.t1110.003
