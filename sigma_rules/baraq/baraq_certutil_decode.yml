# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - Certutil Decode/Network Fetch"
id: baraq-4688-certutil
status: experimental
level: high
description: "Certutil used to decode payloads or fetch remote content - an established LOLBin technique."
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        NewProcessName:endswith: \certutil.exe
        CommandLine:contains: ["-decode", "-decodehex", "-urlcache", "-f ", "http://", "https://"]
    condition: selection_sel
fields:
    - NewProcessName
    - CommandLine
    - SubjectUserName
falsepositives:
    - PKI refresh scripts
tags:
    - attack.defense_evasion
    - attack.t1140
