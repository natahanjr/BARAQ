# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - SeDebugPrivilege Usage"
id: baraq-4673-seDebug
status: experimental
level: high
description: A process invoked SeDebugPrivilege against a critical process such as lsass.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        PrivilegeList:contains: SeDebugPrivilege
        ProcessName:endswith: [\lsass.exe, \svchost.exe]
    condition: selection_sel
fields:
    - PrivilegeList
    - ProcessName
    - SubjectUserName
falsepositives:
    - "Monitoring agents, AV/EDR referencing lsass"
tags:
    - attack.credential_access
    - attack.t1003.001
