# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - Logon with Explicit Credentials"
id: baraq-4648-explicit-creds
status: experimental
level: high
description: A user provided alternate credentials to another host. Commonly used with stolen credentials.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        SubjectUserName:contains: \
        AccountName:endswith: "@"
        TargetServerName:contains: \
    selection_filter:
        SubjectUserName: [SYSTEM, NETWORK SERVICE, LOCAL SERVICE]
        AccountName:endswith: $
    condition: selection_sel and not selection_filter
fields:
    - AccountName
    - TargetServerName
    - SubjectUserName
    - ProcessName
falsepositives:
    - "Run-as tooling, escalation to workstation"
tags:
    - attack.lateral_movement
    - attack.t1078
