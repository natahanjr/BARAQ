# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - SeBackupPrivilege Usage"
id: baraq-4673-seBackup
status: experimental
level: high
description: SeBackupPrivilege used outside a backup context enables file disclosure while ignoring ACLs.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        PrivilegeList:contains: SeBackupPrivilege
        ProcessName:endswith: [\cmd.exe, \powershell.exe, \rundll32.exe]
    condition: selection_sel
fields:
    - PrivilegeList
    - ProcessName
    - SubjectUserName
falsepositives:
    - Backup agents
tags:
    - attack.credential_access
    - attack.t1003.001
