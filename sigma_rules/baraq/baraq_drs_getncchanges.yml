# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - DRS GetNCChanges Request"
id: baraq-4662-repl-drs
status: experimental
level: high
description: "A DRS replication request (GetNCChanges) was issued - the basis of DCSync if unexpected."
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        Properties:contains: ["1131f6ad-9c07-11d1-f79f-00c04fc2dcd2", "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"]
        SubjectUserName:not_contains: $
    condition: selection_sel
fields:
    - ObjectName
    - Properties
    - SubjectUserName
falsepositives:
    - Legacy DCPromo/ADMT tooling
tags:
    - attack.credential_access
    - attack.t1003.006
