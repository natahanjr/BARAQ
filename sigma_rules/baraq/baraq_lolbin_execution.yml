        EventID: 4688
        Image|endswith:
            - certutil.exe
            - wmic.exe
            - regsvr32.exe
            - mshta.exe
            - rundll32.exe
            - bitsadmin.exe
            - forfiles.exe
            - cscript.exe
            - wscript.exe
