# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - Sensitive Account Password Reset"
id: baraq-4724-password-reset
status: experimental
level: high
description: A password reset attempt was made on a privileged or sensitive account.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        EventID: 4724
    selection_sel_priv:
        TargetUserName: [Administrator, Domain Admins, krbtgt, "*admin*", "*adm_*"]
    condition: selection_sel or selection_sel_priv
fields:
    - TargetUserName
    - SubjectUserName
    - TargetSid
falsepositives:
    - "Password escrow tooling, break-glass procedures"
tags:
    - attack.credential_access
    - attack.t1098
