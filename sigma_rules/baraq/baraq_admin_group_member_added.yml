# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - Admin Group Member Added"
id: baraq-4732-admin-group
status: experimental
level: high
description: A member was added to a highly privileged group.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        EventID: [4728, 4732]
        GroupName: [Administrators, Domain Admins, Enterprise Admins, Schema Admins, Backup Operators, Server Operators]
    condition: selection_sel
fields:
    - GroupName
    - MemberName
    - SubjectUserName
    - GroupSid
falsepositives:
    - Deliberate domain administration changes
tags:
    - attack.privilege_escalation
    - attack.t1098.002
