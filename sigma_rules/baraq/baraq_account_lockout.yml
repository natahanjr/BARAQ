# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - User Account Locked Out"
id: baraq-4740-lockout
status: experimental
level: low
description: A user account was locked out due to repeated failed logons.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        TargetUserName:endswith: "@"
    selection_filter:
        TargetUserName:endswith: $
    condition: selection_sel and not selection_filter
fields:
    - TargetUserName
    - SubjectUserName
    - WorkstationName
falsepositives:
    - "Mistyped credentials, stale cached passphrases"
tags:
    - attack.credential_access
    - attack.t1110
