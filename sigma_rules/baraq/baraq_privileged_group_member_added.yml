# BARAQ custom detection rule - Windows Security/System telemetry.
# Generated rule set; tune logsource filters to your environment.
title: "BARAQ - Privileged Builtin Group Member Added"
id: baraq-4728-4732-privereg
status: experimental
level: high
description: A member was added to a group commonly abused for escalation or lateral movement.
logsource:
    product: windows
    service: security
detection:
    selection_sel:
        EventID: [4728, 4732]
        GroupName: [Account Operators, Print Operators, DnsAdmins, "Hyper-V Administrators", Remote Desktop Users, Windows Authorization Access Group]
    condition: selection_sel
fields:
    - GroupName
    - MemberName
    - SubjectUserName
    - GroupSid
falsepositives:
    - IT administrator changes
tags:
    - attack.privilege_escalation
    - attack.t1098.002
