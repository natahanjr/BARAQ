title: BARAQ - Office Application Spawns Shell
id: baraq-4688-office-spawns-shell
status: experimental
level: high
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        EventID: 4688
    filter_office_parent:
        ParentImage|startswith:
            - C:\Program Files\Microsoft Office\
            - C:\Program Files (x86)\Microsoft Office\
            - C:\Program Files\WindowsApps\Microsoft.Office\
    filter_shell_child:
        Image|endswith:
            - powershell.exe
            - pwsh.exe
            - cmd.exe
            - wscript.exe
            - cscript.exe
            - mshta.exe
            - rundll32.exe
    condition: selection and filter_office_parent and filter_shell_child
falsepositives:
    - Office add-ins legitimately launching a shell
fields:
    - EventID
    - Image
    - ParentImage
tags:
    - attack.execution
    - attack.t1204.002