name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff black mypy flake8 bandit

      - name: Remove Python bytecode caches
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + || true
          find . -name "*.pyc" -delete || true

      - name: Check formatting with black
        run: black --check .

      - name: Lint with ruff (strict — real bugs only)
        # F = pyflakes (unused imports, undefined names, shadowed builtins)
        # E9 = syntax errors that prevent Python from parsing the file.
        run: ruff check . --select F,E9 --no-fix

      - name: Lint with ruff (auto-fixable subset)
        run: ruff check . --select F401,F811,F841,E711,E712,E713,E714,F402 --no-fix

      - name: Lint with ruff (full)
        run: ruff check .
        continue-on-error: true

      - name: Type check with mypy
        run: mypy backend --ignore-missing-imports
        continue-on-error: true

      - name: Additional linting with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security linting with bandit
        run: bandit -r backend -ll

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          BARAQ_TEST_MODE: 1
          BARAQ_SKIP_SECRET_GEN: 1
          BARAQ_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/baraq_test"
          BARAQ_CSRF_ENABLED: "0"
        run: |
          python -m pytest tests/test_registration.py tests/test_csrf_and_size.py tests/test_encryption.py tests/test_audit_chain.py tests/test_db_backup.py tests/test_linux_collect.py tests/incidents/ tests/regression/ -v --tb=short

  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit

      - name: Check for vulnerable dependencies
        run: pip-audit -l --skip-editable

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.txt

  docker-image:
    name: Build & Push Docker Image
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max