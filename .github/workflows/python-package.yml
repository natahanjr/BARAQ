name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff black mypy flake8 bandit

      - name: Remove Python bytecode caches
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + || true
          find . -name "*.pyc" -delete || true

      - name: Check formatting with black
        run: black --check .
        continue-on-error: true

      - name: Lint with ruff
        run: ruff check .
        continue-on-error: true

      - name: Type check with mypy
        run: mypy backend --ignore-missing-imports
        continue-on-error: true

      - name: Additional linting with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Security linting with bandit
        run: bandit -r backend -ll
        continue-on-error: true

  test:
    name: Test Suite
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov

      - name: Set up PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE DATABASE baraq_test;"
          sudo -u postgres psql -d baraq_test -c "CREATE EXTENSION IF NOT EXISTS uuid-ossp;"

      - name: Set up PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install postgresql16 -y --no-progress --params '/Password:postgres'
          $pgBin = "C:\Program Files\PostgreSQL\16\bin"
          $data = "C:\Program Files\PostgreSQL\16\data"
          Set-Content (Join-Path $data "pg_hba.conf") -Value @("local all all trust", "host all all 127.0.0.1/32 trust", "host all all ::1/128 trust")
          $svc = Get-Service | Where-Object { $_.Name -like "postgresql*" } | Select-Object -First 1
          if ($svc) {
            Restart-Service -Name $svc.Name -ErrorAction SilentlyContinue
            Start-Sleep 5
          } else {
            Write-Error "No postgresql service found"
            exit 1
          }
          $psql = Join-Path $pgBin "psql.exe"
          for ($i = 0; $i -lt 30; $i++) {
            $out = (& $psql -U postgres -h 127.0.0.1 -p 5432 -c "SELECT 1;" 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          & $psql -U postgres -h 127.0.0.1 -p 5432 -c "CREATE DATABASE baraq_test;"

      - name: Run tests with coverage
        env:
          BARAQ_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/baraq_test
          BARAQ_TEST_MODE: 1
          BARAQ_SKIP_SECRET_GEN: 1
        run: |
          python -m pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true

  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit safety

      - name: Check for vulnerable dependencies
        run: |
          pip-audit -l --skip-editable > pip-audit-report.txt || true
          safety check --full-report > safety-report.txt || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.txt
            safety-report.txt

  docker-image:
    name: Build & Push Docker Image
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max