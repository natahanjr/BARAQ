name: Python Package

on: [push]

jobs:
  build:
    runs-on: windows-latest
    env:
      BARAQ_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/baraq_test
      BARAQ_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
    - uses: actions/checkout@v4
    - name: Start PostgreSQL
      shell: pwsh
      run: |
        choco install postgresql16 -y --no-progress --params '/Password:postgres'
        $hba = "C:\Program Files\PostgreSQL\16\data\pg_hba.conf"
        Add-Content $hba "host all all 127.0.0.1/32 trust"
        Add-Content $hba "host all all ::1/128 trust"
        Restart-Service "postgresql-x64-16"
        $psql = "C:\Program Files\PostgreSQL\16\bin\psql.exe"
        $ok = $false
        for ($i = 0; $i -lt 30; $i++) {
          try { & $psql -U postgres -h 127.0.0.1 -p 5432 -c "SELECT 1;" *> $null; if ($LASTEXITCODE -eq 0) { $ok = $true; break } } catch { }
          Start-Sleep -Seconds 5
        }
        if (-not $ok) { throw "PostgreSQL did not come up" }
        & $psql -U postgres -h 127.0.0.1 -p 5432 -c "CREATE DATABASE baraq_test;"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r requirements-dev.txt
    - name: Lint with flake8 (syntax errors only)
      run: |
        python -m pip install flake8
        flake8 . --count --select=E9 --show-source --statistics
    - name: Test with pytest
      shell: bash
      run: |
        python -m pytest tests/ -q \
          --ignore=tests/test_agent_commands.py \
          --ignore=tests/test_api.py \
          --ignore=tests/test_auth.py \
          --ignore=tests/test_csrf_and_size.py \
          --ignore=tests/test_endpoints.py \
          --ignore=tests/test_ldap_sso.py \
          --ignore=tests/test_mfa.py \
          --ignore=tests/test_ml_async.py \
          --ignore=tests/test_oidc_sso.py \
          --ignore=tests/test_pipeline.py \
          --ignore=tests/test_user_auth.py \
          --ignore=tests/test_verdicts.py
