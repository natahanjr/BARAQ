<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080e14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BARAQ" />
    <title>BARAQ &mdash; Security Operations Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2314b8a6'/%3E%3Cstop offset='100%25' stop-color='%23eab308'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 3 L57 13.5 L57 30 Q57 47 32 61 Q7 47 7 30 L7 13.5 Z' fill='url(%23g)' opacity='0.2'/%3E%3Cpath d='M32 3 L57 13.5 L57 30 Q57 47 32 61 Q7 47 7 30 L7 13.5 Z' fill='none' stroke='url(%23g)' stroke-width='2' opacity='0.9'/%3E%3Cpath d='M36.5 12 L22 34.5 L30.5 34.5 L26.5 52 L44 27.5 L34.5 27.5 Z' fill='%2314b8a6'/%3E%3C/svg%3E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BARAQ" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("baraq-theme");
          var light = saved
            ? saved === "light"
            : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
  </head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Fail-safe: if the app bundle fails to load or crashes before mounting,
      // show a readable message instead of a blank/black screen.
      (function () {
        function showError(message) {
          var root = document.getElementById("root");
          if (!root || root.children.length) return;
          root.removeAttribute("style");
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#e2e8f0;padding:24px;text-align:center">' +
            '<div style="max-width:520px">' +
            '<div style="font-size:22px;font-weight:700;color:#22d3ee;margin-bottom:8px">BARAQ failed to load</div>' +
            '<div style="font-size:14px;color:#94a3b8;margin-bottom:16px">' + message + '</div>' +
            '<button onclick="location.reload(true)" style="background:#0e7490;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer">Reload</button>' +
            "</div></div>";
        }
        window.addEventListener("error", function (e) {
          if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
            showError("The application code could not be loaded. This is usually caused by a stale browser cache after an update. Try a hard refresh (Ctrl+F5) or the Reload button below.");
          }
        });
        setTimeout(function () {
          if (!document.getElementById("root") || !document.getElementById("root").childElementCount) {
            showError("Nothing rendered after the bundle loaded. Check the browser console and verify the backend is running.");
          }
        }, 15000);
      })();
    </script>
  </body>
</html>
