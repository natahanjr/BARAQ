# BARAQ Production Nginx Configuration
#
# Install: Copy to /etc/nginx/sites-available/baraq
#          ln -s /etc/nginx/sites-available/baraq /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# Features:
#   - Reverse proxy to BARAQ backend (port 8001)
#   - Static file serving for frontend
#   - SSL termination (HTTPS)
#   - Rate limiting
#   - Security headers
#   - Gzip compression

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=baraq_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=baraq_ingest:10m rate=100r/s;

upstream baraq_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates (replace with your paths)
    ssl_certificate /etc/ssl/baraq/baraq.crt;
    ssl_certificate_key /etc/ssl/baraq/baraq.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Max upload size (for event ingestion)
    client_max_body_size 10M;

    # Static frontend files
    location / {
        root /opt/baraq/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API endpoints
    location /api/ {
        limit_req zone=baraq_api burst=20 nodelay;

        proxy_pass http://baraq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Agent ingest (higher rate limit)
    location /api/ingest {
        limit_req zone=baraq_ingest burst=50 nodelay;

        proxy_pass http://baraq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://baraq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://baraq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://baraq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check (no rate limit)
    location = /api/health {
        proxy_pass http://baraq_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block common attack patterns
    location ~* (\.env|\.git|wp-admin|wp-login|phpmyadmin) {
        return 404;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
